name: new-release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  actions: write

jobs:

  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: pyproject.toml
          args: --latest --strip header
        env:
          OUTPUT: release_notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file release_notes.md

      - name: Regenerate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: pyproject.toml
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Open a pull request with the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # git-cliff ends the file with blank lines; keep a single newline
          printf '%s\n' "$(cat CHANGELOG.md)" > CHANGELOG.md
          git diff --quiet -- CHANGELOG.md && exit 0
          BRANCH="changelog/${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add CHANGELOG.md
          git commit -m "chore: update changelog for ${{ github.ref_name }} [skip ci]"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: update changelog for ${{ github.ref_name }}" \
            --body "Regenerated by git-cliff from the commit subjects in this release."

  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  publish:
    needs: [tests]
    uses: ./.github/workflows/publish.yml
    secrets: inherit
